# Spike S4 (spec 0007): throwaway, outside the main workspace.
[package]
name = "s4-encode-audio"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_Performance",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_Services",
] }
ffmpeg-sys-next = { version = "9.0.1", default-features = false, features = ["avcodec"] }
