name: ci

# Runs only when asked (scripts/ask-ci.sh dispatches it) and on release tags.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: Job group to run (narrowed runs skip the others)
        type: choice
        default: all
        options: [all, docs, lint, test]
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  docs:
    if: ${{ !inputs.jobs || inputs.jobs == 'all' || inputs.jobs == 'docs' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repo checks
        run: bash scripts/gate.sh --checks

  lint:
    if: ${{ !inputs.jobs || inputs.jobs == 'all' || inputs.jobs == 'lint' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml, incl. components)
        run: rustup toolchain install
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: Swatinem/rust-cache@v2
      - name: fmt + clippy
        run: bash scripts/gate.sh --cargo lint

  test:
    if: ${{ !inputs.jobs || inputs.jobs == 'all' || inputs.jobs == 'test' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml, incl. components)
        run: rustup toolchain install
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: bash scripts/gate.sh --cargo test
