[package]
name = "mixlink-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mixlink-core.workspace = true
mixlink-proto.workspace = true
mixlink-net.workspace = true
mixlink-capture.workspace = true
mixlink-codec.workspace = true
mixlink-audio.workspace = true
mixlink-input.workspace = true
mixlink-render.workspace = true
tauri = { workspace = true, features = ["tray-icon"] }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
thiserror.workspace = true
env_logger.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Pipes",
  "Win32_System_Services",
] }

[build-dependencies]
tauri-build.workspace = true

[features]
# Release builds embed ui/dist instead of loading devUrl (scripts/build.sh enables it).
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
